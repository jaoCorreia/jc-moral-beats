services:
  db:
    image: postgres:16-alpine
    container_name: jc_moral_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jcmoral
    ports:
      - "5432:5432"
    volumes:
      - jcmoral_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jcmoral"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jc_moral_app
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      NODE_ENV: production
      PORT: 4321
      DATABASE_URL: postgres://postgres:postgrespassword@db:5432/jcmoral
      PRODUCER_MASTER_KEY: JC-MORAL-DEV-7790-2026
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

volumes:
  jcmoral_pgdata:
